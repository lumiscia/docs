<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Lumiscia Docs</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f7f8fb;
        color: #171923;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          radial-gradient(circle at top left, rgba(54, 106, 255, 0.14), transparent 30rem),
          linear-gradient(135deg, #f7f8fb 0%, #ffffff 54%, #eef3ff 100%);
      }

      main {
        width: min(100%, 720px);
        border: 1px solid rgba(25, 31, 47, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 24px 70px rgba(25, 31, 47, 0.12);
        padding: clamp(28px, 6vw, 56px);
      }

      .eyebrow {
        margin: 0 0 16px;
        color: #4967c8;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(36px, 8vw, 72px);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        max-width: 56ch;
        margin: 24px 0 0;
        color: #4b5565;
        font-size: 18px;
        line-height: 1.65;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 32px;
      }

      a {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        padding: 0 16px;
        color: #172554;
        font-weight: 700;
        text-decoration: none;
      }

      a.primary {
        background: #1d4ed8;
        color: #ffffff;
      }

      a.secondary {
        border: 1px solid rgba(29, 78, 216, 0.24);
        background: rgba(255, 255, 255, 0.62);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #10131a;
          color: #f8fafc;
        }

        body {
          background:
            radial-gradient(circle at top left, rgba(86, 141, 255, 0.18), transparent 30rem),
            linear-gradient(135deg, #10131a 0%, #111827 56%, #172033 100%);
        }

        main {
          border-color: rgba(255, 255, 255, 0.12);
          background: rgba(17, 24, 39, 0.84);
          box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
        }

        .eyebrow {
          color: #93b4ff;
        }

        p {
          color: #cbd5e1;
        }

        a {
          color: #dbeafe;
        }

        a.secondary {
          border-color: rgba(147, 180, 255, 0.26);
          background: rgba(255, 255, 255, 0.05);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404</p>
      <h1>This page slipped out of frame.</h1>
      <p>
        The docs page you requested is not available. Head back to the docs home, or jump into the
        guides if you were looking for implementation details.
      </p>
      <nav aria-label="Helpful links">
        <a class="primary" href="/">Docs home</a>
        <a class="secondary" href="/guides">Guides</a>
        <a class="secondary" href="https://lumiscia.com/contact">Contact support</a>
      </nav>
    </main>
  </body>
</html>
